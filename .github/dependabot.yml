version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for all Gradle dependency/plugin bumps. AndroidX,
      # Compose BOM, Kotlin, Ktor etc. often have to move together anyway.
      gradle-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
